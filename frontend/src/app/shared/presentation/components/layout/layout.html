<header class="app-header">
  <a class="brand" routerLink="/report">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            stroke="#F5A000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="brand__name">Maintenance Tickets</span>
  </a>

  <div class="app-header__actions">
    <nav class="role-switch" aria-label="Switch view">
      <span class="role-switch__label">View as</span>
      <div class="role-switch__options">
        <a routerLink="/report" routerLinkActive="is-active" ariaCurrentWhenActive="page">User</a>
        <a routerLink="/board" routerLinkActive="is-active" ariaCurrentWhenActive="page">Operator</a>
      </div>
    </nav>
    <!-- Actions from the bounded contexts (e.g. notifications), composed in the app root -->
    <ng-content select="[header-actions]" />
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>
